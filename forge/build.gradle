// tatnat client for (Lex) Forge 1.17 - 1.20.1. Reuses the shared core (../src/main) and the Fabric
// build's platform folder for the same Minecraft version (../src/<platform_source>, Mojang names).
// Forge runs these versions with SRG names, so the jar is reobfuscated and the mixins get a refmap.
plugins {
	id 'java'
	id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

def mcVersion = project.minecraft_version
def platformDir = project.platform_source
version = project.mod_version
base { archivesName = "tatnat-client-forge-mc${mcVersion}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDir '../src/main/java'
			srcDir "../src/${platformDir}/java"
			srcDir 'src/common/java'
			exclude 'com/tatnat/client/mc/Entry.java' // the Fabric entry point
		}
		resources {
			srcDir '../src/main/resources'
			srcDir "../src/${platformDir}/resources"
			srcDir 'src/common/resources'
			exclude 'fabric.mod.json'
		}
	}
}

legacyForge {
	version = project.forge_version
	runs {
		client {
			client()
			gameDirectory = file("run/${mcVersion}")
			programArguments.addAll '--username', 'tatnat', '--width', '1600', '--height', '900'
			if (project.hasProperty('devtest')) systemProperty 'tatnat.devtest', project.property('devtest')
			if (project.hasProperty('quickjoin')) programArguments.addAll '--quickPlayMultiplayer', project.property('quickjoin').toString()
		}
		server {
			server()
			gameDirectory = file("run/${mcVersion}")
			programArgument '--nogui'
		}
	}
	mods {
		tatnatclient { sourceSet sourceSets.main }
	}
}

mixin {
	add sourceSets.main, 'tatnatclient.refmap.json'
	config 'tatnatclient.mixins.json'
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
	implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
	jarJar 'io.github.llamalad7:mixinextras-forge:0.4.1'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'mc', project.minecraft_range
	filesMatching('META-INF/mods.toml') {
		expand 'version': project.version, 'minecraft_range': project.minecraft_range, 'forge_range': project.forge_range
	}
	// Point the mixin config at the refmap the annotation processor writes (SRG names at runtime).
	filesMatching('tatnatclient.mixins.json') {
		filter { line -> line.contains('"package"') ? line + '\n\t"refmap": "tatnatclient.refmap.json",' : line }
	}
}

jar {
	manifest.attributes('MixinConfigs': 'tatnatclient.mixins.json')
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

tasks.register('collectJar', Copy) {
	dependsOn tasks.named('reobfJar')
	from tasks.named('reobfJar')
	rename { "tatnat-client-forge-mc${mcVersion}-${project.version}.jar" }
	into rootProject.file('../dist')
}
