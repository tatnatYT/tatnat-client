plugins {
	// Only one family is applied per build (chosen below from minecraft_version):
	//  - 26.x is unobfuscated and uses plain fabric-loom;
	//  - 1.14 - 1.21.11 are obfuscated and need the remapping plugin;
	//  (1.8.9 - 1.13.2 build separately in legacy/, with Legacy Fabric's older plugin.)
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

version = project.mod_version
group = project.maven_group

def mcVersion = project.minecraft_version
def unobfuscated = mcVersion.startsWith('26.')
def platformDir = project.platform_source
def javaVersion = project.java_version as int

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

base {
	archivesName = "${project.archives_base_name}-mc${mcVersion}"
}

// Shared code lives in src/main/java (plain Java 8, no Minecraft); each version's layer in
// src/<platform>/java with its own mixins and fabric.mod.json.
sourceSets {
	main {
		java {
			srcDir "src/${platformDir}/java"
			srcDir "src/fabric/java" // Fabric-specific helpers (LoaderInfo)
		}
		resources { srcDir "src/${platformDir}/resources" }
	}
}
// Dev runs only: the resource loader shipped for 1.17 and older reads assets from a mod's first
// root path, which in dev is the classes folder. Put the resources there too (jars are unaffected).
if (mcVersion.startsWith('1.') && mcVersion.tokenize('.')[1].toInteger() < 18) {
	sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory.get().asFile
} else {
	// An earlier old-version build may have left its resources (fabric.mod.json...) there; clear them.
	tasks.named('processResources') {
		doFirst { project.delete(project.fileTree(sourceSets.main.java.classesDirectory.get().asFile) { exclude '**/*.class' }) }
	}
}

loom {
	runs {
		// Each Minecraft version gets its own run folder (worlds can't be opened by older versions).
		configureEach { runDir "run/${mcVersion}" }
		client {
			// Dev testing only: -Pdevtest=main runs the scripted test in DevTestSteps,
			// -Pquickjoin=127.0.0.1:25599 joins the local dev server straight away.
			programArgs "--username", "tatnat", "--width", "1600", "--height", "900"
			// Report every broken hook in one run (logged as "Mixin apply failed") instead of
			// crashing at the first; devtest.js fails the run if any are logged.
			vmArg "-Dmixin.ignoreRequired=true"
			if (project.hasProperty('devtest')) vmArg "-Dtatnat.devtest=${project.property('devtest')}"
			if (project.hasProperty('quickjoin')) {
				def target = project.property('quickjoin').toString()
				// Quick Play arrived in 1.20; older versions take --server/--port.
				def parts = mcVersion.tokenize('.')
				boolean quickPlay = parts[0] != '1' || parts[1].toInteger() >= 20
				if (quickPlay) programArgs "--quickPlayMultiplayer", target
				else if (parts[1].toInteger() >= 17 && parts[1] != "18") programArgs "--server", target.tokenize(':')[0], "--port", target.tokenize(':')[1]
				// 1.16 and older and 1.18: --server is ignored or joins before resources finish loading in dev,
				// so DevTest joins from the title screen once loading is done.
				else vmArg "-Dtatnat.join=${target}"
			}
		}
	}
	mods {
		"tatnatclient" { sourceSet sourceSets.main }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	if (unobfuscated) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		// Fabric Loader alone never loads a mod's assets; bundle Fabric API's resource loader.
		implementation include(fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version))
		implementation include(fabricApi.module("fabric-api-base", project.fabric_api_version))
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		// Fabric Loader alone never loads a mod's assets (fonts, logo); Fabric API's resource
		// loader does. Bundle just that module (and its base) inside our jar so the mod works on
		// its own. If the player also has full Fabric API, Loader picks the newest copy.
		modImplementation include(fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version))
		modImplementation include(fabricApi.module("fabric-api-base", project.fabric_api_version))
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc", project.minecraft_dependency
	// The font filters below depend on the version; bump fontFix when they change.
	inputs.property "mcVersion", mcVersion
	inputs.property "fontFix", 2
	filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_dependency": project.minecraft_dependency }
	// The "reference" font provider (fallback to the vanilla font) only exists from 1.20; older
	// versions reject the whole definition, so drop it there (Inter covers everything we draw).
	def v = mcVersion.tokenize('.')
	int minor = v[0] == '1' ? v[1].toInteger() : 99
	int patch = v.size() > 2 ? v[2].toInteger() : 0
	if (minor < 20) {
		filesMatching("assets/tatnatclient/font/w*.json") { filter { line -> line.startsWith(',{"type":"reference"') ? null : line } }
	}
	// Before 1.20.5 TTF fonts go through stb_truetype, which fits ascent-to-descent (not the em)
	// into "size". Scale by Inter's (ascent - descent) / em so text matches the FreeType versions.
	if (minor < 20 || (minor == 20 && patch < 5)) {
		filesMatching("assets/tatnatclient/font/w*.json") {
			filter { line -> line.replaceAll(/"size":(\d+)/) { all, n -> '"size":' + String.format(Locale.ROOT, "%.3f", n.toInteger() * 1.20996) } }
		}
	}
}

// Versions that ship with Java 8 are also run on Java 8 in dev, like players run them
// (pass -Porg.gradle.java.installations.paths=<jdk8>; devtest.js does this from JAVA8_HOME).
if (javaVersion == 8) {
	tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}
java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.register('collectJar', Copy) {
	dependsOn tasks.named('build')
	from layout.buildDirectory.dir('libs')
	include '*.jar'
	exclude '*-sources.jar'
	into rootProject.layout.projectDirectory.dir('dist')
}
