modLoader = "javafml"
loaderVersion = "[1,)"
license = "All-Rights-Reserved"

[[mods]]
modId = "tatnatclient"
version = "${version}"
displayName = "tatnat client"
authors = "tatnat"
description = "The in-game side of the tatnat launcher: a Right Shift mod menu, a drag-and-drop HUD editor and PvP / quality-of-life mods."
logoFile = "assets/tatnatclient/icon.png"
displayURL = "https://www.youtube.com/@tatnatmc"

[[mixins]]
config = "tatnatclient.mixins.json"

[[dependencies.tatnatclient]]
modId = "neoforge"
mandatory = true
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.tatnatclient]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
